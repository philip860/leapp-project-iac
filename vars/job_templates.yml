---
controller_templates:
  - name: 01 - Fleet Analysis
    organization: "{{ controller_organization | default('Default') }}"
    project: RHEL Upgrade Automation
    inventory: RHEL 8 Fleet
    playbook: analysis.yml
    execution_environment: "{{ controller_execution_environment | default(omit) }}"
    credentials:
      - RHEL Machine Credential
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    survey_enabled: true
    survey_spec:
      name: Fleet Analysis Survey
      description: Select the inventory group to target.
      spec:
        - question_name: Select inventory group
          question_description: Use to limit job to hosts that are members of the selected host group.
          required: true
          type: multiplechoice
          variable: rhel_inventory_group
          choices:
            - ALL_rhel
            - rhel7
            - rhel8
            - rhel9
          default: ALL_rhel

  - name: 02 - Create Snapshot
    organization: "{{ controller_organization | default('Default') }}"
    project: RHEL Upgrade Automation
    inventory: RHEL 8 Fleet
    playbook: snapshot_instance_lvm.yml
    execution_environment: "{{ controller_execution_environment | default(omit) }}"
    credentials:
      - RHEL Machine Credential
    extra_vars:
      lvm_snapshots_action: create
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true

  - name: 03 - Remediate Inhibitors
    organization: "{{ controller_organization | default('Default') }}"
    project: RHEL Upgrade Automation
    inventory: RHEL 8 Fleet
    playbook: remediate.yml
    execution_environment: "{{ controller_execution_environment | default(omit) }}"
    credentials:
      - RHEL Machine Credential
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true

  - name: 04 - Run Leapp Upgrade
    organization: "{{ controller_organization | default('Default') }}"
    project: RHEL Upgrade Automation
    inventory: RHEL 8 Fleet
    playbook: upgrade.yml
    execution_environment: "{{ controller_execution_environment | default(omit) }}"
    credentials:
      - RHEL Machine Credential
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    survey_enabled: true
    survey_spec:
      name: Leapp Upgrade Survey
      description: Select the inventory group to target.
      spec:
        - question_name: Select inventory group
          question_description: Use to limit job to hosts that are members of the selected host group.
          required: true
          type: multiplechoice
          variable: rhel_inventory_group
          choices:
            - ALL_rhel
            - rhel7
            - rhel8
            - rhel9
          default: ALL_rhel

  - name: 05 - Reboot Host
    organization: "{{ controller_organization | default('Default') }}"
    project: RHEL Upgrade Automation
    inventory: RHEL 8 Fleet
    playbook: reboot.yml
    execution_environment: "{{ controller_execution_environment | default(omit) }}"
    credentials:
      - RHEL Machine Credential
    ask_inventory_on_launch: true
    ask_limit_on_launch: true

  - name: 06 - Post Upgrade Validation
    organization: "{{ controller_organization | default('Default') }}"
    project: RHEL Upgrade Automation
    inventory: RHEL 8 Fleet
    playbook: validate.yml
    execution_environment: "{{ controller_execution_environment | default(omit) }}"
    credentials:
      - RHEL Machine Credential
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true

  - name: 07 - Remove Snapshot
    organization: "{{ controller_organization | default('Default') }}"
    project: RHEL Upgrade Automation
    inventory: RHEL 8 Fleet
    playbook: snapshot_instance_lvm.yml
    execution_environment: "{{ controller_execution_environment | default(omit) }}"
    credentials:
      - RHEL Machine Credential
    extra_vars:
      lvm_snapshots_action: remove
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true

  - name: 08 - Rollback Snapshot
    organization: "{{ controller_organization | default('Default') }}"
    project: RHEL Upgrade Automation
    inventory: RHEL 8 Fleet
    playbook: snapshot_instance_lvm.yml
    execution_environment: "{{ controller_execution_environment | default(omit) }}"
    credentials:
      - RHEL Machine Credential
    extra_vars:
      lvm_snapshots_action: revert
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true