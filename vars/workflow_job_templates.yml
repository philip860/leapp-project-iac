---
controller_workflows:
  - name: RHEL 7 to 8 Upgrade Workflow
    organization: "{{ controller_organization | default('Default') }}"
    inventory: RHEL 7 Fleet
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    workflow_nodes:
      - identifier: fleet_analysis
        unified_job_template: 01 - Fleet Analysis
        success_nodes:
          - identifier: create_snapshot

      - identifier: create_snapshot
        unified_job_template: 02 - Create Snapshot
        success_nodes:
          - identifier: leapp_preupgrade

      - identifier: leapp_preupgrade
        unified_job_template: 03 - Leapp Preupgrade
        success_nodes:
          - identifier: remediate_inhibitors

      - identifier: remediate_inhibitors
        unified_job_template: 04 - Remediate Inhibitors
        success_nodes:
          - identifier: leapp_preupgrade_after_remediation

      - identifier: leapp_preupgrade_after_remediation
        unified_job_template: 03 - Leapp Preupgrade
        success_nodes:
          - identifier: run_leapp_upgrade

      - identifier: run_leapp_upgrade
        unified_job_template: 05 - Run Leapp Upgrade
        success_nodes:
          - identifier: reboot_host
        failure_nodes:
          - identifier: rollback_snapshot

      - identifier: reboot_host
        unified_job_template: 06 - Reboot Host
        success_nodes:
          - identifier: post_upgrade_validation
        failure_nodes:
          - identifier: rollback_snapshot

      - identifier: post_upgrade_validation
        unified_job_template: 07 - Post Upgrade Validation
        success_nodes:
          - identifier: remove_snapshot
        failure_nodes:
          - identifier: rollback_snapshot

      - identifier: remove_snapshot
        unified_job_template: 08 - Remove Snapshot

      - identifier: rollback_snapshot
        unified_job_template: 09 - Rollback Snapshot

  - name: RHEL 8 to 9 Upgrade Workflow
    organization: "{{ controller_organization | default('Default') }}"
    inventory: RHEL 8 Fleet
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    workflow_nodes:
      - identifier: fleet_analysis
        unified_job_template: 01 - Fleet Analysis
        success_nodes:
          - identifier: create_snapshot

      - identifier: create_snapshot
        unified_job_template: 02 - Create Snapshot
        success_nodes:
          - identifier: leapp_preupgrade

      - identifier: leapp_preupgrade
        unified_job_template: 03 - Leapp Preupgrade
        success_nodes:
          - identifier: remediate_inhibitors

      - identifier: remediate_inhibitors
        unified_job_template: 04 - Remediate Inhibitors
        success_nodes:
          - identifier: leapp_preupgrade_after_remediation

      - identifier: leapp_preupgrade_after_remediation
        unified_job_template: 03 - Leapp Preupgrade
        success_nodes:
          - identifier: run_leapp_upgrade

      - identifier: run_leapp_upgrade
        unified_job_template: 05 - Run Leapp Upgrade
        success_nodes:
          - identifier: reboot_host
        failure_nodes:
          - identifier: rollback_snapshot

      - identifier: reboot_host
        unified_job_template: 06 - Reboot Host
        success_nodes:
          - identifier: post_upgrade_validation
        failure_nodes:
          - identifier: rollback_snapshot

      - identifier: post_upgrade_validation
        unified_job_template: 07 - Post Upgrade Validation
        success_nodes:
          - identifier: remove_snapshot
        failure_nodes:
          - identifier: rollback_snapshot

      - identifier: remove_snapshot
        unified_job_template: 08 - Remove Snapshot

      - identifier: rollback_snapshot
        unified_job_template: 09 - Rollback Snapshot

  - name: RHEL 9 to 10 Upgrade Workflow
    organization: "{{ controller_organization | default('Default') }}"
    inventory: RHEL 9 Fleet
    ask_inventory_on_launch: true
    ask_limit_on_launch: true
    ask_variables_on_launch: true
    extra_vars:
      upgrade_support_status: future
      note: RHEL 9 to RHEL 10 workflow placeholder for future Leapp support
    workflow_nodes:
      - identifier: fleet_analysis
        unified_job_template: 01 - Fleet Analysis