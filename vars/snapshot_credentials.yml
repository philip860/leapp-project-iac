---
# ------------------------------------------------------------
# Snapshot workflow credential mapping
#
# Dynamically builds the credential list used by snapshot
# Job Templates based on enabled providers.
#
# The RHEL Machine Credential is always required.
#
# Provider-specific credentials are added automatically when
# the required configuration is supplied in secrets.yml.
#
# Current providers:
#   - AWS EC2/EBS snapshots -> RHEL AWS Credential
#
# Future expansion:
#   - VMware snapshots      -> RHEL VMware Credential
#   - Azure snapshots       -> RHEL Azure Credential
#   - Google Cloud snapshots-> RHEL GCP Credential
#
# This allows a single snapshot_dispatcher.yml workflow to
# support multiple platforms without requiring unused
# credentials to exist in Ansible Automation Platform.
# ------------------------------------------------------------

rhel_snapshot_credentials: >-
  {{
    ['RHEL Machine Credential']
    +
    (
      ['RHEL AWS Credential']
      if (
        aws_access_key | default('') | length > 0
        and aws_secret_key | default('') | length > 0
      )
      else []
    )
  }}