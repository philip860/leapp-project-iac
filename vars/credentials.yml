---
controller_credentials:
  #
  # SSH credential used to connect to managed RHEL hosts
  #
  - name: RHEL Machine Credential
    organization: "{{ controller_organization | default('Default') }}"
    credential_type: Machine
    inputs:
      username: "{{ aap_ssh_username | default('ec2-user') }}"
      ssh_key_data: "{{ aap_ssh_private_key }}"


  #
  # RHSM / Satellite credential used by the upgrade workflows
  #
  - name: RHEL Satellite Credential
    description: RHSM or Satellite registration credential
    organization: "{{ controller_organization }}"
    credential_type: RHEL Satellite
    inputs:
      satellite_rhsm_activate: "{{ satellite_rhsm_activate | default('false') }}"
      satellite_rhsm_username: "{{ satellite_rhsm_username | default('') }}"
      satellite_rhsm_password: "{{ satellite_rhsm_password | default('') }}"
      satellite_rhsm_activation_key: "{{ satellite_rhsm_activation_key | default('') }}"
      satellite_rhsm_org: "{{ satellite_rhsm_org | default('') }}"
      satellite_rhsm_server_url: "{{ satellite_rhsm_server_url | default('') }}"
      satellite_rhsm_auto_attach: "{{ satellite_rhsm_auto_attach | default('true') }}"

  #
  # Optional AWS credential used by the AWS snapshot provider
  # Required only for EC2/EBS snapshot workflows.
  #
  - name: RHEL AWS Credential
    description: AWS credential for EC2/EBS snapshot workflows
    organization: "{{ controller_organization | default('Default') }}"
    credential_type: Amazon Web Services
    inputs:
      username: "{{ aws_access_key | default('') }}"
      password: "{{ aws_secret_key | default('') }}"
    state: "{{ 'present' if (aws_access_key | default('') | length > 0 and aws_secret_key | default('') | length > 0) else 'absent' }}"