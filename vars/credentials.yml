---
controller_credentials:
  #
  # SSH credential used to connect to managed RHEL hosts
  #
  - name: RHEL Machine Credential
    organization: "{{ controller_organization | default('Default') }}"
    credential_type: Machine
    inputs:
      username: "{{ aap_ssh_username | default('ec2-user') }}"
      ssh_key_data: "{{ aap_ssh_private_key }}"


  #
  # RHSM / Satellite credential used by the upgrade workflows
  #
  - name: RHEL Satellite Credential
    organization: "{{ controller_organization | default('Default') }}"
    credential_type: RHEL Satellite
    inputs:
      rhsm_activate: "{{ rhsm_activate | default(false) }}"

      # Username/password registration
      rhsm_username: "{{ rhsm_username | default('') }}"
      rhsm_password: "{{ rhsm_password | default('') }}"

      # Activation key registration
      rhsm_activation_key: "{{ rhsm_activation_key | default('') }}"
      rhsm_org: "{{ rhsm_org | default('') }}"

      # Satellite only (blank for console.redhat.com RHSM)
      rhsm_server_url: "{{ rhsm_server_url | default('') }}"

      rhsm_auto_attach: "{{ rhsm_auto_attach | default(true) }}"