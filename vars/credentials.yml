---
controller_credentials:
  #
  # SSH credential used to connect to managed RHEL hosts
  #
  - name: RHEL Machine Credential
    organization: "{{ controller_organization | default('Default') }}"
    credential_type: Machine
    inputs:
      username: "{{ aap_ssh_username | default('ec2-user') }}"
      ssh_key_data: "{{ aap_ssh_private_key }}"


  #
  # RHSM / Satellite credential used by the upgrade workflows
  #
  - name: RHEL Satellite Credential
    organization: "{{ controller_organization | default('Default') }}"
    credential_type: RHEL Satellite
    inputs:
      satellite_rhsm_activate: "{{ satellite_rhsm_activate }}"
      satellite_rhsm_username: "{{ satellite_rhsm_username }}"
      satellite_rhsm_password: "{{ satellite_rhsm_password }}"
      satellite_rhsm_activation_key: "{{ satellite_rhsm_activation_key }}"
      satellite_rhsm_org: "{{ satellite_rhsm_org }}"
      satellite_rhsm_server_url: "{{ satellite_rhsm_server_url }}"
      satellite_rhsm_auto_attach: "{{ satellite_rhsm_auto_attach }}"