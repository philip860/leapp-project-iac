---
controller_credentials:
  - name: RHEL Machine Credential
    organization: "{{ controller_organization | default('Default') }}"
    credential_type: Machine
    inputs:
      username: "{{ aap_ssh_username | default('ec2-user') }}"
      ssh_key_data: "{{ aap_ssh_private_key }}"

  - name: RHEL Satellite Credential
    organization: "{{ controller_organization | default('Default') }}"
    credential_type: Red Hat Satellite 6
    inputs:
      username: "{{ rhsm_username }}"
      password: "{{ rhsm_password }}"
      host: "{{ rhsm_server_url }}"