---
controller_credential_types:
  - name: RHEL Satellite
    description: RHSM or Satellite registration settings for RHEL upgrade workflows
    kind: cloud

    inputs:
      fields:
        - id: satellite_rhsm_activate
          type: string
          label: Activate/Register host with RHSM or Satellite
          choices:
            - "true"
            - "false"

        - id: satellite_rhsm_username
          type: string
          label: RHSM/Satellite Username

        - id: satellite_rhsm_password
          type: string
          label: RHSM/Satellite Password
          secret: true

        - id: satellite_rhsm_activation_key
          type: string
          label: RHSM/Satellite Activation Key
          secret: true

        - id: satellite_rhsm_org
          type: string
          label: RHSM/Satellite Organization

        - id: satellite_rhsm_server_url
          type: string
          label: RHSM/Satellite Server URL

        - id: satellite_rhsm_auto_attach
          type: string
          label: Auto Attach Subscription
          choices:
            - "true"
            - "false"

      required:
        - satellite_rhsm_activate