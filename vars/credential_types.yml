---
controller_credential_types:
  - name: RHEL Satellite
    description: RHSM or Satellite registration settings for RHEL upgrade workflows
    kind: cloud
    inputs:
      fields:
        - id: rhsm_activate
          type: boolean
          label: Activate/Register host with RHSM or Satellite

        - id: rhsm_username
          type: string
          label: RHSM/Satellite Username

        - id: rhsm_password
          type: string
          label: RHSM/Satellite Password
          secret: true

        - id: rhsm_activation
          type: string
          label: RHSM/Satellite Activation Key
          secret: true

        - id: rhsm_org
          type: string
          label: RHSM/Satellite Organization

        - id: rhsm_server_url
          type: string
          label: RHSM/Satellite Server URL

        - id: rhsm_auto_attach
          type: boolean
          label: Auto Attach Subscription

      required:
        - rhsm_activate

    injectors:
      extra_vars:
        rhsm_activate: !unsafe "{{ rhsm_activate }}"
        rhsm_username: !unsafe "{{ rhsm_username }}"
        rhsm_password: !unsafe "{{ rhsm_password }}"
        rhsm_activation: !unsafe "{{ rhsm_activation }}"
        rhsm_org: !unsafe "{{ rhsm_org }}"
        rhsm_server_url: !unsafe "{{ rhsm_server_url }}"
        rhsm_auto_attach: !unsafe "{{ rhsm_auto_attach }}"
