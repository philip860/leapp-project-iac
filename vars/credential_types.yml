---
controller_credential_types:
  - name: RHEL Satellite
    description: RHSM or Satellite registration settings for RHEL upgrade workflows
    kind: cloud

    inputs:
      fields:
        - id: rhsm_activate
          type: string
          label: Activate/Register host with RHSM or Satellite
          choices:
            - "true"
            - "false"

        - id: rhsm_username
          type: string
          label: RHSM/Satellite Username

        - id: rhsm_password
          type: string
          label: RHSM/Satellite Password
          secret: true

        - id: rhsm_activation_key
          type: string
          label: RHSM/Satellite Activation Key
          secret: true

        - id: rhsm_org
          type: string
          label: RHSM/Satellite Organization

        - id: rhsm_server_url
          type: string
          label: RHSM/Satellite Server URL

        - id: rhsm_auto_attach
          type: string
          label: Auto Attach Subscription
          choices:
            - "true"
            - "false"

      required:
        - rhsm_activate

    injectors:
      extra_vars:
        rhsm_activate: "{{ '{{' }} rhsm_activate {{ '}}' }}"
        rhsm_username: "{{ '{{' }} rhsm_username {{ '}}' }}"
        rhsm_password: "{{ '{{' }} rhsm_password {{ '}}' }}"
        rhsm_activation_key: "{{ '{{' }} rhsm_activation_key {{ '}}' }}"
        rhsm_org: "{{ '{{' }} rhsm_org {{ '}}' }}"
        rhsm_server_url: "{{ '{{' }} rhsm_server_url {{ '}}' }}"
        rhsm_auto_attach: "{{ '{{' }} rhsm_auto_attach {{ '}}' }}"