---
- name: Configure AAP RHEL Fleet Upgrade Automation
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - infra.aap_configuration
    - ansible.controller

  vars_files:
    - ../vars/secrets.yml
    - ../vars/credential_types.yml
    - ../vars/credentials.yml
    - ../vars/projects.yml
    - ../vars/job_templates.yml
    - ../vars/workflow_job_templates.yml
    - ../vars/surveys.yml
    - ../vars/groups.yml

  vars:
    controller_organization: "{{ controller_organization | default('Default') }}"

  pre_tasks:
    - name: Verify controller bootstrap variables are loaded
      ansible.builtin.debug:
        msg:
          - "controller_hostname={{ controller_hostname }}"
          - "controller_ip={{ controller_ip }}"
          - "controller_organization={{ controller_organization }}"

    - name: Set AAP controller IP from inventory group or vars file
      ansible.builtin.set_fact:
        resolved_controller_ip: >-
          {{
            (
              groups['aap_server'][0]
              if groups['aap_server'] is defined and groups['aap_server'] | length > 0
              else controller_ip
            )
            | regex_replace('^_', '')
          }}

    - name: Build preferred AAP controller endpoint list
      ansible.builtin.set_fact:
        aap_controller_endpoint_candidates:
          - "https://{{ controller_hostname }}"
          - "https://{{ resolved_controller_ip }}"

    - name: Check available AAP controller endpoints
      ansible.builtin.uri:
        url: "{{ item }}/api/gateway/v1/status/"
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code:
          - 200
          - 401
          - 403
        timeout: 10
      loop: "{{ aap_controller_endpoint_candidates }}"
      register: aap_endpoint_checks
      failed_when: false
      changed_when: false
      check_mode: false

    - name: Select first reachable AAP controller endpoint
      ansible.builtin.set_fact:
        controller_host: >-
          {{
            (
              aap_endpoint_checks.results | default([])
              | selectattr('status', 'defined')
              | selectattr('status', 'in', [200, 401, 403])
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Fail if no AAP controller endpoint is reachable
      ansible.builtin.fail:
        msg:
          - "AAP controller is not reachable using DNS or IP."
          - "Tried DNS: https://{{ controller_hostname }}"
          - "Tried IP: https://{{ resolved_controller_ip }}"
      when: controller_host is not defined or controller_host | length == 0

    - name: Set controller connection variables
      ansible.builtin.set_fact:
        aap_hostname: "{{ controller_host }}"
        aap_username: "{{ controller_username }}"
        aap_password: "{{ controller_password }}"
        aap_validate_certs: "{{ controller_validate_certs | default(false) }}"
        controller_oauthtoken: ""
      no_log: true

    - name: Show selected AAP controller endpoint
      ansible.builtin.debug:
        msg: "Using AAP controller endpoint: {{ controller_host }}"

  tasks:
    - name: Verify target AAP organization exists
      ansible.controller.organization:
        name: "{{ controller_organization }}"
        state: exists
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs | default(false) }}"

    - name: Configure AAP RHEL Fleet Upgrade objects
      block:
        - name: Configure RHEL Upgrade Automation inventory
          ansible.controller.inventory:
            name: RHEL Upgrade Automation
            organization: "{{ controller_organization }}"
            description: Inventory for RHEL Leapp upgrade automation across RHEL 7, 8, 9, and future RHEL 10 systems
            state: present
            controller_host: "{{ controller_host }}"
            controller_username: "{{ controller_username }}"
            controller_password: "{{ controller_password }}"
            validate_certs: "{{ controller_validate_certs | default(false) }}"

        - name: Configure AAP inventory groups
          ansible.controller.group:
            name: "{{ item.name }}"
            inventory: "{{ item.inventory }}"
            description: "{{ item.description | default(omit) }}"
            variables: "{{ item.variables | default({}) }}"
            state: present
            controller_host: "{{ controller_host }}"
            controller_username: "{{ controller_username }}"
            controller_password: "{{ controller_password }}"
            validate_certs: "{{ controller_validate_certs | default(false) }}"
          loop: "{{ controller_groups }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Configure AAP custom credential types directly
          ansible.controller.credential_type:
            name: "{{ item.name }}"
            description: "{{ item.description | default(omit) }}"
            kind: "{{ item.kind | default('cloud') }}"
            inputs: "{{ item.inputs }}"
            injectors:
              extra_vars:
                rhsm_activate: "{{ '{{' }} satellite_rhsm_activate {{ '}}' }}"
                rhsm_username: "{{ '{{' }} satellite_rhsm_username {{ '}}' }}"
                rhsm_password: "{{ '{{' }} satellite_rhsm_password {{ '}}' }}"
                rhsm_activation_key: "{{ '{{' }} satellite_rhsm_activation_key {{ '}}' }}"
                rhsm_org: "{{ '{{' }} satellite_rhsm_org {{ '}}' }}"
                rhsm_server_url: "{{ '{{' }} satellite_rhsm_server_url {{ '}}' }}"
                rhsm_auto_attach: "{{ '{{' }} satellite_rhsm_auto_attach {{ '}}' }}"
            state: present
            controller_host: "{{ controller_host }}"
            controller_username: "{{ controller_username }}"
            controller_password: "{{ controller_password }}"
            validate_certs: "{{ controller_validate_certs | default(false) }}"
          loop: "{{ controller_credential_types }}"
          loop_control:
            label: "{{ item.name }}"
          when:
            - controller_credential_types is defined
            - controller_credential_types | length > 0

        - name: Configure RHEL Satellite credential directly
          ansible.controller.credential:
            name: RHEL Satellite
            description: RHSM or Satellite registration credential
            organization: "{{ controller_organization }}"
            credential_type: RHEL Satellite
            inputs:
              satellite_rhsm_activate: "{{ satellite_rhsm_activate | default('false') }}"
              satellite_rhsm_username: "{{ satellite_rhsm_username | default('') }}"
              satellite_rhsm_password: "{{ satellite_rhsm_password | default('') }}"
              satellite_rhsm_activation_key: "{{ satellite_rhsm_activation_key | default('') }}"
              satellite_rhsm_org: "{{ satellite_rhsm_org | default('') }}"
              satellite_rhsm_server_url: "{{ satellite_rhsm_server_url | default('') }}"
              satellite_rhsm_auto_attach: "{{ satellite_rhsm_auto_attach | default('true') }}"
            state: present
            controller_host: "{{ controller_host }}"
            controller_username: "{{ controller_username }}"
            controller_password: "{{ controller_password }}"
            validate_certs: "{{ controller_validate_certs | default(false) }}"

        - name: Remove directly managed RHEL Satellite credential from role list
          ansible.builtin.set_fact:
            controller_credentials: >-
              {{
                controller_credentials | default([])
                | rejectattr('name', 'equalto', 'RHEL Satellite')
                | list
              }}

        - name: Configure remaining AAP credentials
          ansible.builtin.include_role:
            name: infra.aap_configuration.controller_credentials
          when:
            - controller_credentials is defined
            - controller_credentials | length > 0

        - name: Configure AAP projects
          ansible.builtin.include_role:
            name: infra.aap_configuration.controller_projects

        - name: Synchronize configured AAP projects
          ansible.controller.project_update:
            name: "{{ item.name }}"
            wait: true
            interval: 10
            timeout: 600
            controller_host: "{{ controller_host }}"
            controller_username: "{{ controller_username }}"
            controller_password: "{{ controller_password }}"
            validate_certs: "{{ controller_validate_certs | default(false) }}"
          loop: "{{ controller_projects }}"
          loop_control:
            label: "{{ item.name }}"

        - name: Configure AAP job templates
          ansible.builtin.include_role:
            name: infra.aap_configuration.controller_job_templates

        - name: Configure AAP workflow job templates
          ansible.builtin.include_role:
            name: infra.aap_configuration.controller_workflow_job_templates

      environment:
        CONTROLLER_HOST: "{{ controller_host }}"
        CONTROLLER_USERNAME: "{{ controller_username }}"
        CONTROLLER_PASSWORD: "{{ controller_password }}"
        CONTROLLER_VERIFY_SSL: "{{ controller_validate_certs | default(false) | string | lower }}"
        TOWER_HOST: "{{ controller_host }}"
        TOWER_USERNAME: "{{ controller_username }}"
        TOWER_PASSWORD: "{{ controller_password }}"
        TOWER_VERIFY_SSL: "{{ controller_validate_certs | default(false) | string | lower }}"