---
- name: Export AAP workflow configuration as IaC
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - ansible.controller

  vars_files:
    - ../vars/secrets.yml

  vars:
    export_dir: "../exports"
    export_workflows:
      - "RHEL 7 to 8 Upgrade Workflow"
      - "RHEL 8 to 9 Upgrade Workflow"
      - "RHEL 9 to 10 Upgrade Workflow"

  pre_tasks:
    - name: Ensure export directory exists
      ansible.builtin.file:
        path: "{{ export_dir }}"
        state: directory
        mode: "0755"

    - name: Set controller connection variables
      ansible.builtin.set_fact:
        controller_host: "https://{{ controller_hostname }}"
        controller_validate_certs: "{{ controller_validate_certs | default(false) }}"

  tasks:
    - name: Export RHEL upgrade workflow configuration
      ansible.controller.export:
        workflow_job_templates: "{{ export_workflows }}"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
      register: workflow_export

    - name: Save workflow export to YAML
      ansible.builtin.copy:
        dest: "{{ export_dir }}/rhel-upgrade-workflows-export.yml"
        mode: "0644"
        content: "{{ workflow_export.assets | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Export related job templates
      ansible.controller.export:
        job_templates:
          - "01 - Fleet Analysis"
          - "02 - Create Snapshot"
          - "03 - Remediate Inhibitors"
          - "04 - Run Leapp Upgrade"
          - "05 - Reboot Host"
          - "06 - Post Upgrade Validation"
          - "07 - Remove Snapshot"
          - "08 - Rollback Snapshot"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
      register: job_template_export

    - name: Save job template export to YAML
      ansible.builtin.copy:
        dest: "{{ export_dir }}/rhel-upgrade-job-templates-export.yml"
        mode: "0644"
        content: "{{ job_template_export.assets | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Export inventories
      ansible.controller.export:
        inventories:
          - "RHEL 7 Fleet"
          - "RHEL 8 Fleet"
          - "RHEL 9 Fleet"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
      register: inventory_export

    - name: Save inventory export to YAML
      ansible.builtin.copy:
        dest: "{{ export_dir }}/rhel-upgrade-inventories-export.yml"
        mode: "0644"
        content: "{{ inventory_export.assets | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Export projects
      ansible.controller.export:
        projects:
          - "RHEL Upgrade Automation"
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
      register: project_export

    - name: Save project export to YAML
      ansible.builtin.copy:
        dest: "{{ export_dir }}/rhel-upgrade-projects-export.yml"
        mode: "0644"
        content: "{{ project_export.assets | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Show export files
      ansible.builtin.debug:
        msg:
          - "Export completed."
          - "{{ export_dir }}/rhel-upgrade-workflows-export.yml"
          - "{{ export_dir }}/rhel-upgrade-job-templates-export.yml"
          - "{{ export_dir }}/rhel-upgrade-inventories-export.yml"
          - "{{ export_dir }}/rhel-upgrade-projects-export.yml"