---
- name: Export AAP workflow configuration as IaC using Gateway API
  hosts: localhost
  connection: local
  gather_facts: false

  vars_files:
    - ../vars/secrets.yml

  vars:
    export_dir: "../exports"

  pre_tasks:
    - name: Ensure export directory exists
      ansible.builtin.file:
        path: "{{ export_dir }}"
        state: directory
        mode: "0755"

    - name: Build preferred AAP controller endpoint list
      ansible.builtin.set_fact:
        aap_controller_endpoint_candidates:
          - "https://{{ controller_hostname }}"
          - "https://{{ controller_ip }}"

    - name: Check available AAP controller endpoints
      ansible.builtin.uri:
        url: "{{ item }}/api/gateway/v1/status/"
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        status_code:
          - 200
          - 401
          - 403
        timeout: 10
      loop: "{{ aap_controller_endpoint_candidates }}"
      register: aap_endpoint_checks
      failed_when: false
      changed_when: false

    - name: Select first reachable AAP controller endpoint
      ansible.builtin.set_fact:
        controller_host: >-
          {{
            (
              aap_endpoint_checks.results | default([])
              | selectattr('status', 'defined')
              | selectattr('status', 'in', [200, 401, 403])
              | map(attribute='item')
              | list
              | first
            ) | default('')
          }}

    - name: Fail if no AAP controller endpoint is reachable
      ansible.builtin.fail:
        msg:
          - "AAP controller is not reachable using DNS or IP."
          - "Tried DNS: https://{{ controller_hostname }}"
          - "Tried IP: https://{{ controller_ip }}"
      when: controller_host is not defined or controller_host | length == 0

    - name: Show selected AAP controller endpoint
      ansible.builtin.debug:
        msg: "Using AAP controller endpoint: {{ controller_host }}"

  tasks:
    - name: Export workflow job templates
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/workflow_job_templates/?page_size=200"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        return_content: true
      register: workflow_export

    - name: Export workflow nodes for each workflow
      ansible.builtin.uri:
        url: "{{ controller_host }}{{ item.related.workflow_nodes }}?page_size=200"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        return_content: true
      loop: "{{ workflow_export.json.results | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: workflow_nodes_export

    - name: Export workflow survey spec for each workflow
      ansible.builtin.uri:
        url: "{{ controller_host }}{{ item.related.survey_spec }}"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        return_content: true
      loop: "{{ workflow_export.json.results | default([]) }}"
      loop_control:
        label: "{{ item.name }}"
      register: workflow_survey_export

    - name: Export job templates
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/job_templates/?page_size=200"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        return_content: true
      register: job_template_export

    - name: Export inventories
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/inventories/?page_size=200"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        return_content: true
      register: inventory_export

    - name: Export projects
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/projects/?page_size=200"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        return_content: true
      register: project_export

    - name: Export credentials metadata
      ansible.builtin.uri:
        url: "{{ controller_host }}/api/controller/v2/credentials/?page_size=200"
        method: GET
        user: "{{ controller_username }}"
        password: "{{ controller_password }}"
        force_basic_auth: true
        validate_certs: "{{ controller_validate_certs | default(false) }}"
        return_content: true
      register: credential_export

    - name: Save workflow job templates export
      ansible.builtin.copy:
        dest: "{{ export_dir }}/workflow_job_templates_raw.yml"
        mode: "0644"
        content: "{{ workflow_export.json | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Save workflow nodes export
      ansible.builtin.copy:
        dest: "{{ export_dir }}/workflow_nodes_raw.yml"
        mode: "0644"
        content: "{{ workflow_nodes_export.results | default([]) | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Save workflow surveys export
      ansible.builtin.copy:
        dest: "{{ export_dir }}/workflow_surveys_raw.yml"
        mode: "0644"
        content: "{{ workflow_survey_export.results | default([]) | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Save job template export
      ansible.builtin.copy:
        dest: "{{ export_dir }}/job_templates_raw.yml"
        mode: "0644"
        content: "{{ job_template_export.json | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Save inventory export
      ansible.builtin.copy:
        dest: "{{ export_dir }}/inventories_raw.yml"
        mode: "0644"
        content: "{{ inventory_export.json | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Save project export
      ansible.builtin.copy:
        dest: "{{ export_dir }}/projects_raw.yml"
        mode: "0644"
        content: "{{ project_export.json | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Save credentials metadata export
      ansible.builtin.copy:
        dest: "{{ export_dir }}/credentials_raw.yml"
        mode: "0644"
        content: "{{ credential_export.json | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Show export files
      ansible.builtin.debug:
        msg:
          - "Export completed."
          - "{{ export_dir }}/workflow_job_templates_raw.yml"
          - "{{ export_dir }}/workflow_nodes_raw.yml"
          - "{{ export_dir }}/workflow_surveys_raw.yml"
          - "{{ export_dir }}/job_templates_raw.yml"
          - "{{ export_dir }}/inventories_raw.yml"
          - "{{ export_dir }}/projects_raw.yml"
          - "{{ export_dir }}/credentials_raw.yml"