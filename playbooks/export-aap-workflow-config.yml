---
- name: Export AAP configuration as IaC
  hosts: localhost
  connection: local
  gather_facts: false

  collections:
    - ansible.controller

  vars_files:
    - ../vars/secrets.yml

  vars:
    export_dir: "../exports"

  pre_tasks:
    - name: Ensure export directory exists
      ansible.builtin.file:
        path: "{{ export_dir }}"
        state: directory
        mode: "0755"

    - name: Set controller connection variables
      ansible.builtin.set_fact:
        controller_host: "https://{{ controller_hostname }}"
        controller_validate_certs: "{{ controller_validate_certs | default(false) }}"

  tasks:
    - name: Export all AAP controller assets
      ansible.controller.export:
        all: true
        controller_host: "{{ controller_host }}"
        controller_username: "{{ controller_username }}"
        controller_password: "{{ controller_password }}"
        validate_certs: "{{ controller_validate_certs }}"
      register: aap_export

    - name: Save full AAP export to YAML
      ansible.builtin.copy:
        dest: "{{ export_dir }}/aap-controller-full-export.yml"
        mode: "0644"
        content: "{{ aap_export.assets | to_nice_yaml(indent=2, sort_keys=false) }}"

    - name: Show export file
      ansible.builtin.debug:
        msg:
          - "Export completed."
          - "{{ export_dir }}/aap-controller-full-export.yml"